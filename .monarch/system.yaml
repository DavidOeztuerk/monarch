version: 1
theme: monarch                      # monarch | neutral
project:
  name: "monarch-G-0101"
mana:
  plan: pro                         # pro | max5 | max20 | api-key
  limits:
    five_hour: { work_until_pct: 90, clamp: [90, 97] }
    seven_day: { work_until_pct: 96, clamp: [96, 99] }
  skip_recap_if_reset_within_min: 10
  pacing_tolerance_pts: 15
policy:
  penalty_zone: block               # warn | block
  scope_lock: true
  refuse_high_rank_in_bypass_mode: true
  risk_tags:
    auth: { min_rank: A, paths: ["src/**/Auth/**", "src/**/Identity/**", "src/**/Jwt*"] }
    payment: { min_rank: S, paths: ["src/**/Payments/**"] }
    migration: { min_rank: B, paths: ["**/Migrations/**"] }
    policy: { min_rank: A, paths: ["src/Monarch.Policy/**", "src/Monarch.Cli/HookRunner.cs", "src/Monarch.Cli/ProjectPaths.cs", "plugin/scripts/**", "plugin/hooks/**"] }
    ledger: { min_rank: A, paths: ["src/Monarch.Infrastructure.Ledger/**", "src/Monarch.Domain/LedgerEvents.cs"] }
    infra: { min_rank: A, paths: [".github/workflows/**", "scripts/install-local.sh"] }
  deny_bash: ["git push --force*", "git reset --hard*", "dotnet ef database drop*", "monarch permit*", "monarch promote*"]
  protect_paths: [".monarch/ledger/**", ".monarch/local/**", ".monarch/shadows/*/shadow.yaml", ".monarch/system.yaml", ".monarch/quests/**", ".monarch/gates/**", ".claude/settings*.json"]
  protect_secrets_extra: []
  read_only_shadows: ["warden", "scout"]
recap:
  path: .monarch/recap/
