name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    env:
      # Latency gate (ADR-0015, docs/adr/0015-relatives-latenz-gate.md): the CI gates the ratio of the hook to the bare
      # program start (`monarch --version`) on the same runner, at the median. The limits are fixed in
      # bench/hook-latency.sh; change them only together with measured numbers and run ids in ADR-0015.
      # LIMIT_MS stays 20: p99 <= 20 ms is the criterion on the owner's machine (MVP gate C1, issue #70). Here the
      # absolute p50/p95/p99 are reported in the log and the job summary and do not fail the job (declared loosening,
      # owner decision of 2026-11-11). Never set BENCH_INJECT here; it exists only to prove that the gate turns red.
      LIMIT_MS: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish Native AOT
        run: dotnet publish src/Monarch.Cli -c Release -r ${{ matrix.rid }} -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monarch-${{ matrix.rid }}
          path: publish/monarch
          if-no-files-found: error
      - name: Install hyperfine and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine jq
      - name: Install hyperfine and jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y hyperfine jq
      - name: Latency gate self-test
        run: bench/test-gate.sh
      # Both latency steps block on both operating systems. Neither may carry continue-on-error (ADR-0015).
      - name: Hook latency, relative gate (direct)
        env:
          GATE_MODE: relative
        shell: bash
        run: |
          set -o pipefail
          { echo "### Hook latency, direct (${{ matrix.rid }})"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          bench/hook-latency.sh "$GITHUB_WORKSPACE/publish/monarch" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Hook latency, relative gate (through plugin/scripts/monarch)
        env:
          GATE_MODE: relative
        shell: bash
        run: |
          set -o pipefail
          { echo "### Hook latency via wrapper (${{ matrix.rid }})"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          WRAPPER=1 bench/hook-latency.sh "$GITHUB_WORKSPACE/publish/monarch" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          set -eu
          sh -n plugin/scripts/monarch
          for f in bench/*.sh e2e/*.sh scripts/*.sh plugin/tests/*.sh; do
            [ -f "$f" ] && bash -n "$f"
          done
      - name: Wrapper tests
        run: |
          set -eu
          sh plugin/tests/wrapper-test.sh
          dash plugin/tests/wrapper-test.sh
      - name: JSON validity
        run: |
          set -eu
          find plugin .claude-plugin -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Wrapper version matches plugin.json
        run: |
          set -eu
          wrapper=$(sed -n 's/^MONARCH_VERSION=//p' plugin/scripts/monarch | head -n1)
          manifest=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "wrapper=$wrapper plugin.json=$manifest"
          [ -n "$wrapper" ] && [ "$wrapper" = "$manifest" ]
