name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    env:
      # Gate for bench/hook-latency.sh: 20 ms on every runner; do not raise it without recording measured numbers from
      # this job's log next to the new value. CI gates on p95, not p99 (Q-0121): shared runners preempt sporadically.
      # Measured on the same commit: run 40597438299 failed macOS (out-of-scope p99 41.8/52.8 ms) and Linux
      # (126/159 ms) with p50 7.4/11.6 ms; the disk-vs-RAM experiment showed macOS spikes on a RAM disk too
      # (denied-bash p99 20.7 ms, p50 7.5 ms), so it is scheduling noise, not ledger I/O; locally the same binary held
      # p99 <= 11 ms. p99 <= 20 ms stays the MVP criterion and is measured on the target machine (GATE_PCT=99).
      LIMIT_MS: "20"
      GATE_PCT: "95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish Native AOT
        run: dotnet publish src/Monarch.Cli -c Release -r ${{ matrix.rid }} -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monarch-${{ matrix.rid }}
          path: publish/monarch
          if-no-files-found: error
      - name: Install hyperfine and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine jq
      - name: Install hyperfine and jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y hyperfine jq
      - name: Latency gate self-test
        run: bench/test-gate.sh
      - name: Hook latency (direct)
        run: bench/hook-latency.sh "$GITHUB_WORKSPACE/publish/monarch"
      - name: Hook latency (through plugin/scripts/monarch)
        run: WRAPPER=1 bench/hook-latency.sh "$GITHUB_WORKSPACE/publish/monarch"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          set -eu
          sh -n plugin/scripts/monarch
          for f in bench/*.sh e2e/*.sh scripts/*.sh plugin/tests/*.sh; do
            [ -f "$f" ] && bash -n "$f"
          done
      - name: Wrapper tests
        run: |
          set -eu
          sh plugin/tests/wrapper-test.sh
          dash plugin/tests/wrapper-test.sh
      - name: JSON validity
        run: |
          set -eu
          find plugin .claude-plugin -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Wrapper version matches plugin.json
        run: |
          set -eu
          wrapper=$(sed -n 's/^MONARCH_VERSION=//p' plugin/scripts/monarch | head -n1)
          manifest=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "wrapper=$wrapper plugin.json=$manifest"
          [ -n "$wrapper" ] && [ "$wrapper" = "$manifest" ]
